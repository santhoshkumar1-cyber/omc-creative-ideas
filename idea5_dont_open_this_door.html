<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Don't Open This Deal Door – BBD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #080808;
    --card: #111;
    --surface: #1a1a1a;
    --red: #e63946;
    --warning: #ffb703;
    --green: #2dc653;
    --text: #f5f5f0;
    --muted: #555;
    --border: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

  /* Noise texture */
  body::after {
    content: ''; position: fixed; inset: 0; opacity: .03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 999;
  }

  .container { max-width: 820px; margin: 0 auto; padding: 2rem 1rem; position: relative; }

  header { text-align: center; margin-bottom: 1rem; padding: 2rem 1rem; }
  .warning-tape {
    background: var(--warning); color: #000; font-family: 'Bebas Neue', sans-serif;
    font-size: .9rem; letter-spacing: .3em; padding: .4rem 2rem; margin-bottom: 1.2rem;
    display: inline-block; transform: rotate(-1.5deg);
    box-shadow: 0 4px 24px rgba(255,183,3,0.3);
  }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(2rem,6vw,3.5rem); letter-spacing: .04em; line-height: 1; }
  h1 em { font-style: normal; color: var(--red); }
  header p { font-family: 'Courier Prime', monospace; color: var(--muted); margin-top: .8rem; font-size: .88rem; }

  /* Attempts bar */
  .attempts-bar {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.5rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .att-label { font-family: 'Courier Prime', monospace; font-size: .78rem; color: var(--red); }
  .att-dots { display: flex; gap: .4rem; }
  .att-dot { width: 28px; height: 28px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px rgba(230,57,70,0.4); transition: all .3s; }
  .att-dot.used { background: var(--surface); box-shadow: none; border: 1px solid var(--muted); opacity: .3; }
  .opened-label { margin-left: auto; font-family: 'Courier Prime', monospace; font-size: .75rem; color: var(--muted); }

  /* Door grid */
  .doors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }

  .door-wrap { perspective: 800px; }
  .door {
    position: relative; background: var(--card); border: 2px solid var(--border);
    border-radius: 16px; padding: 1.5rem 1rem; text-align: center; cursor: pointer;
    transition: border-color .2s, box-shadow .2s; overflow: hidden;
    transform-style: preserve-3d;
  }
  .door::before {
    content: ''; position: absolute; inset: 0; border-radius: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
  }
  .door:hover { border-color: rgba(230,57,70,0.5); box-shadow: 0 0 30px rgba(230,57,70,0.1); }
  .door.cracked { border-color: var(--muted); animation: none; opacity: .6; }
  .door.opened { border-color: var(--green); box-shadow: 0 0 20px rgba(45,198,83,0.2); cursor: default; }
  .door.glowing { animation: glow 1.5s ease-in-out infinite; }
  @keyframes glow { 0%,100%{box-shadow:0 0 8px rgba(230,57,70,0.2)} 50%{box-shadow:0 0 28px rgba(230,57,70,0.4)} }
  .door.shake { animation: doorShake .6s; }
  @keyframes doorShake { 0%,100%{transform:translateX(0) rotate(0)} 15%{transform:translateX(-8px) rotate(-1deg)} 30%{transform:translateX(8px) rotate(1deg)} 45%{transform:translateX(-5px)} 60%{transform:translateX(5px)} 75%{transform:translateX(-3px)} }

  .door-icon { font-size: 2.5rem; margin-bottom: .6rem; display: block; }
  .door-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: .08em; color: var(--text); }
  .door-warning { font-family: 'Courier Prime', monospace; font-size: .65rem; color: var(--muted); margin-top: .3rem; }
  .door-crack { position: absolute; top: .5rem; right: .7rem; font-size: .7rem; color: var(--muted); display: none; }
  .door.cracked .door-crack { display: block; }
  .door-glow-dot { position: absolute; top: .7rem; left: .7rem; width: 7px; height: 7px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); animation: blink 1s infinite; }
  .door.opened .door-glow-dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: none; }
  .door.cracked .door-glow-dot { display: none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

  /* Challenge overlay */
  .challenge-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
    z-index: 100; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .challenge-overlay.show { display: flex; }
  .challenge-card {
    background: var(--card); border: 2px solid var(--red); border-radius: 20px;
    padding: 2rem; max-width: 420px; width: 90%; animation: popIn .4s;
    position: relative;
  }
  @keyframes popIn { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
  .ch-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--red); margin-bottom: .5rem; }
  .ch-sub { font-family: 'Courier Prime', monospace; font-size: .8rem; color: var(--muted); margin-bottom: 1.2rem; }
  .ch-body { margin-bottom: 1.5rem; }

  /* Swipe bar */
  .swipe-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; height: 48px; position: relative; overflow: hidden; cursor: grab; }
  .swipe-handle {
    position: absolute; left: 4px; top: 4px; width: 40px; height: 40px;
    background: var(--red); border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem; cursor: grab; transition: background .3s; user-select: none;
  }
  .swipe-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Courier Prime', monospace; font-size: .78rem; color: var(--muted); pointer-events: none; }

  /* Riddle */
  .riddle-opts { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
  .ropt {
    border: 1.5px solid var(--border); border-radius: 10px; padding: .5rem 1rem;
    font-size: .85rem; cursor: pointer; background: var(--surface); transition: all .2s;
  }
  .ropt:hover { border-color: var(--red); }
  .ropt.correct { background: rgba(45,198,83,0.1); border-color: var(--green); color: var(--green); }
  .ropt.wrong { background: rgba(230,57,70,0.1); border-color: var(--red); color: var(--red); }

  /* Reveal card */
  .reveal-card {
    display: none; background: var(--surface); border: 1px solid rgba(45,198,83,0.3);
    border-radius: 14px; padding: 1.2rem; margin-top: 1rem; animation: fadeIn .4s;
  }
  .reveal-card.show { display: block; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .reveal-header { font-family: 'Bebas Neue', sans-serif; font-size: 1rem; color: var(--green); margin-bottom: .4rem; }
  .reveal-text { font-size: .85rem; color: var(--muted); line-height: 1.5; }

  .close-btn {
    position: absolute; top: 1rem; right: 1rem; background: none; border: none;
    color: var(--muted); font-size: 1.2rem; cursor: pointer;
  }
  .confirm-btn {
    background: var(--red); color: #fff; font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem; letter-spacing: .08em; padding: .8rem 2rem; border-radius: 99px;
    border: none; cursor: pointer; transition: transform .2s; width: 100%;
  }
  .confirm-btn:hover { transform: scale(1.02); }

  /* Share section */
  .share-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; text-align: center; margin-bottom: 2rem; }
  .share-section p { font-family: 'Courier Prime', monospace; font-size: .82rem; color: var(--muted); margin-bottom: .8rem; }
  .share-btn {
    background: var(--warning); color: #000; font-family: 'Bebas Neue', sans-serif;
    letter-spacing: .08em; font-size: .9rem; padding: .7rem 1.8rem; border-radius: 99px;
    border: none; cursor: pointer; margin: .2rem; transition: transform .2s;
  }
  .share-btn:hover { transform: scale(1.04); }
  .share-btn.outline { background: transparent; color: var(--text); border: 1px solid var(--border); }

  .steps-section { margin-top: 2.5rem; }
  .steps-title { font-family: 'Courier Prime', monospace; font-size: .72rem; color: var(--red); text-transform: uppercase; letter-spacing: .12em; margin-bottom: .8rem; }
  .step-item { display: flex; gap: .8rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: .8rem 1rem; margin-bottom: .5rem; }
  .sn { background: var(--red); color: #fff; font-weight: 800; font-size: .72rem; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .st { font-size: .84rem; color: var(--muted); }
</style>
</head>
<body>

<!-- Challenge Overlay -->
<div class="challenge-overlay" id="challengeOverlay">
  <div class="challenge-card">
    <button class="close-btn" onclick="closeChallenge()">✕</button>
    <div class="ch-title" id="chTitle">Challenge Title</div>
    <div class="ch-sub" id="chSub">Complete this to open the door.</div>
    <div class="ch-body" id="chBody"></div>
    <div class="reveal-card" id="revealCard">
      <div class="reveal-header" id="revealHeader">🔍 Revealed</div>
      <div class="reveal-text" id="revealText"></div>
    </div>
    <div id="chActions" style="margin-top:1rem"></div>
  </div>
</div>

<div class="container">

  <header>
    <div class="warning-tape">⚠ FORBIDDEN ZONE ⚠</div>
    <h1>Don't Open <em>This</em> Deal Door</h1>
    <p>// You were not supposed to see this page. //</p>
  </header>

  <!-- Attempts -->
  <div class="attempts-bar">
    <span class="att-label">🔴 Daily Attempts Left</span>
    <div class="att-dots" id="attDots">
      <div class="att-dot"></div>
      <div class="att-dot"></div>
      <div class="att-dot"></div>
    </div>
    <span class="opened-label" id="openedLabel">0 doors opened today</span>
  </div>

  <!-- Doors -->
  <div class="doors-grid" id="doorsGrid"></div>

  <!-- Share Section -->
  <div class="share-section">
    <p>Someone dared you not to tap these doors. Did you listen?</p>
    <button class="share-btn" onclick="copyShare()">📤 Share: I Opened The Forbidden Door</button>
    <button class="share-btn outline" onclick="resetDoors()">🔄 Reset Doors</button>
  </div>

  <!-- Steps -->
  <div class="steps-section">
    <div class="steps-title">How It Works</div>
    <div id="stepsList"></div>
  </div>

</div>

<script>
const doors = [
  {
    label: "Don't Tap", icon: '🚫', warning: 'Seriously. Don\'t.',
    challenge: 'swipe', chTitle: 'SWIPE TO PROVE IT',
    chSub: 'Swipe the handle all the way right to open.',
    reveal: { header: '🕵️ You opened "Don\'t Tap"', text: 'Most people secretly want: Wireless Earbuds. You\'re one of them. BBD has 60% off.' },
  },
  {
    label: 'Not For You', icon: '🙅', warning: 'Wrong crowd.',
    challenge: 'riddle', chTitle: 'RIDDLE FIRST',
    chSub: 'Answer correctly to enter.',
    riddle: { q: 'I have a screen but can\'t dream. I connect you. What am I?', opts: ['Book', 'Smartphone', 'Clock', 'Mirror'], ans: 'Smartphone' },
    reveal: { header: '📱 You opened "Not For You"', text: 'Everyone said this wasn\'t for you. But the #1 searched item on BBD is: Smartphones. Surprise?' },
  },
  {
    label: 'Too Risky', icon: '⚠️', warning: 'You\'ll regret this.',
    challenge: 'hold', chTitle: 'HOLD YOUR NERVE',
    chSub: 'Hold the button for 3 seconds without letting go.',
    reveal: { header: '🔥 You opened "Too Risky"', text: 'You opened Too Risky. Here\'s what most people are secretly watching: Smart TVs, Gaming Laptops, Home Gyms. BBD\'s biggest categories.' },
  },
  {
    label: "You'll Regret", icon: '😈', warning: 'Last warning.',
    challenge: 'riddle', chTitle: 'LAST CHANCE TO TURN BACK',
    chSub: 'One question. One chance.',
    riddle: { q: 'Which sale gives you the most deals in one day in India?', opts: ['Diwali Sale','Big Billion Days','End of Season','Monday Deal'], ans: 'Big Billion Days' },
    reveal: { header: '🛒 You opened "You\'ll Regret"', text: 'You were warned. Now you know: BBD is India\'s biggest shopping day. Millions shop. Will you?' },
  },
  {
    label: 'Skip This', icon: '⏭️', warning: 'Nothing to see.',
    challenge: 'tap', chTitle: 'TAP 5 TIMES TO OPEN',
    chSub: 'If you dare.',
    reveal: { header: '🎁 You opened "Skip This"', text: 'You skipped the skip. The reward? A secret early-access link to BBD deals drops in your inbox tonight.' },
  },
];

const steps = [
  'Entry Hook – Black screen with warning: "You are not supposed to open these doors."',
  'Forbidden Doors Appear – Doors labeled: "Don\'t Tap", "Not For You", "Too Risky", "You\'ll Regret This", "Skip This."',
  'User Taps Out of Curiosity – Door shakes, glitches, resists opening.',
  'Mini Challenge Before Opening – User must hold, swipe, solve riddle, or tap at right moment.',
  'Unexpected Reveal – Door reveals playful category teaser with BBD insight.',
  'Door Memory – Opened doors stay cracked; unopened doors glow more.',
  'Replay Loop – User gets limited door openings per day.',
  'Social Trigger – Share: "I opened the door Flipkart told me not to."',
];

let attemptsLeft = 3;
let openedCount = 0;
let activeChallenge = null;
let swipeDone = false;
let holdDone = false;
let tapsDone = 0;
let challengeSolved = false;

function buildDoors(){
  const g = document.getElementById('doorsGrid');
  g.innerHTML = '';
  doors.forEach((d,i)=>{
    const w = document.createElement('div');
    w.className = 'door-wrap';
    const el = document.createElement('div');
    el.className = 'door glowing';
    el.id = `door-${i}`;
    el.innerHTML = `
      <div class="door-glow-dot"></div>
      <div class="door-crack">💀 Broken</div>
      <span class="door-icon">${d.icon}</span>
      <div class="door-label">${d.label}</div>
      <div class="door-warning">${d.warning}</div>
    `;
    el.onclick = () => doorClick(i);
    w.appendChild(el);
    g.appendChild(w);
  });
}

function doorClick(i){
  const el = document.getElementById(`door-${i}`);
  if(el.classList.contains('opened') || el.classList.contains('cracked')) return;
  if(attemptsLeft <= 0){ alert('No attempts left today. Come back tomorrow!'); return; }

  el.classList.add('shake');
  setTimeout(()=>{
    el.classList.remove('shake');
    openChallenge(i);
  }, 600);
}

function openChallenge(i){
  const d = doors[i];
  activeChallenge = i;
  challengeSolved = false;
  swipeDone = false; holdDone = false; tapsDone = 0;

  document.getElementById('chTitle').textContent = d.chTitle;
  document.getElementById('chSub').textContent = d.chSub;
  document.getElementById('revealCard').classList.remove('show');
  document.getElementById('chActions').innerHTML = '';

  const body = document.getElementById('chBody');

  if(d.challenge === 'swipe'){
    body.innerHTML = `
      <div class="swipe-bar" id="swipeBar">
        <div class="swipe-handle" id="swipeHandle">→</div>
        <div class="swipe-label">Swipe right →</div>
      </div>
    `;
    setupSwipe();
  } else if(d.challenge === 'riddle'){
    body.innerHTML = `
      <p style="font-weight:600;margin-bottom:.8rem">${d.riddle.q}</p>
      <div class="riddle-opts">${d.riddle.opts.map(o=>`<button class="ropt" onclick="answerRiddle(this,'${o}','${d.riddle.ans}')">${o}</button>`).join('')}</div>
    `;
  } else if(d.challenge === 'hold'){
    body.innerHTML = `
      <button class="confirm-btn" id="holdBtn" style="background:var(--surface);border:1px solid var(--border);color:var(--text)" onmousedown="startHold()" onmouseup="endHold()" ontouchstart="startHold(event)" ontouchend="endHold()">
        Hold Me (3s)
      </button>
      <div id="holdPct" style="margin-top:.5rem;font-family:'Courier Prime',monospace;font-size:.78rem;color:var(--muted);text-align:center"></div>
    `;
  } else if(d.challenge === 'tap'){
    body.innerHTML = `
      <button class="confirm-btn" id="tapBtn" onclick="doTap5()">
        TAP ME — <span id="tapC">0</span>/5
      </button>
    `;
    tapsDone = 0;
  }

  document.getElementById('challengeOverlay').classList.add('show');
}

function setupSwipe(){
  const bar = document.getElementById('swipeBar');
  const handle = document.getElementById('swipeHandle');
  let dragging = false;
  let startX = 0;

  const maxX = () => bar.clientWidth - 44;

  function onMove(clientX){
    if(!dragging) return;
    const dx = clientX - startX;
    const clamp = Math.max(0, Math.min(dx, maxX()));
    handle.style.left = clamp + 'px';
    if(clamp >= maxX() - 5 && !swipeDone){ swipeDone = true; solveChallenge(); }
  }

  handle.addEventListener('mousedown', e=>{ dragging=true; startX=e.clientX-handle.offsetLeft; });
  handle.addEventListener('touchstart', e=>{ dragging=true; startX=e.touches[0].clientX-handle.offsetLeft; }, {passive:true});
  document.addEventListener('mousemove', e=>onMove(e.clientX));
  document.addEventListener('touchmove', e=>onMove(e.touches[0].clientX), {passive:true});
  document.addEventListener('mouseup', ()=>{ if(!swipeDone){ handle.style.left='4px'; } dragging=false; });
  document.addEventListener('touchend', ()=>{ if(!swipeDone){ handle.style.left='4px'; } dragging=false; });
}

function answerRiddle(btn, chosen, correct){
  document.querySelectorAll('.ropt').forEach(b=>b.style.pointerEvents='none');
  if(chosen === correct){ btn.classList.add('correct'); solveChallenge(); }
  else { btn.classList.add('wrong'); setTimeout(()=>{ failChallenge(); }, 600); }
}

let holdInterval2;
let heldMs2 = 0;
function startHold(e){ if(e) e.preventDefault(); heldMs2=0; holdInterval2=setInterval(()=>{
  heldMs2+=100; const pct=Math.min(100,(heldMs2/3000)*100);
  document.getElementById('holdPct').textContent=`Holding... ${Math.floor(pct)}%`;
  if(heldMs2>=3000){ clearInterval(holdInterval2); solveChallenge(); }
},100); }
function endHold(){ clearInterval(holdInterval2); if(heldMs2<3000){ document.getElementById('holdPct').textContent='Let go too early!'; } }

function doTap5(){ tapsDone++; document.getElementById('tapC').textContent=tapsDone; if(tapsDone>=5) solveChallenge(); }

function solveChallenge(){
  if(challengeSolved) return;
  challengeSolved = true;
  const d = doors[activeChallenge];
  const rc = document.getElementById('revealCard');
  document.getElementById('revealHeader').textContent = d.reveal.header;
  document.getElementById('revealText').textContent = d.reveal.text;
  rc.classList.add('show');
  document.getElementById('chActions').innerHTML = `<button class="confirm-btn" onclick="confirmOpen()">✓ Got It. Close Door.</button>`;
  useAttempt();
  markDoorOpened(activeChallenge);
}

function failChallenge(){
  markDoorCracked(activeChallenge);
  useAttempt();
  setTimeout(closeChallenge, 400);
}

function useAttempt(){
  if(attemptsLeft > 0){
    attemptsLeft--;
    const dots = document.querySelectorAll('.att-dot');
    dots[3-1-attemptsLeft]?.classList.add('used');
  }
}

function markDoorOpened(i){
  const el = document.getElementById(`door-${i}`);
  el.classList.remove('glowing','shake');
  el.classList.add('opened');
  openedCount++;
  document.getElementById('openedLabel').textContent = `${openedCount} door${openedCount>1?'s':''} opened today`;
}

function markDoorCracked(i){
  const el = document.getElementById(`door-${i}`);
  el.classList.remove('glowing','shake');
  el.classList.add('cracked');
}

function confirmOpen(){ closeChallenge(); }
function closeChallenge(){ document.getElementById('challengeOverlay').classList.remove('show'); activeChallenge=null; }

function copyShare(){
  const msg = `I opened the door Flipkart told me not to open. 😈 Can you resist? #BigBillionDays #ForbiddenDoor`;
  navigator.clipboard?.writeText(msg);
  alert('Copied!\n\n'+msg);
}

function resetDoors(){
  attemptsLeft=3; openedCount=0;
  document.querySelectorAll('.att-dot').forEach(d=>d.classList.remove('used'));
  document.getElementById('openedLabel').textContent='0 doors opened today';
  buildDoors();
}

const sl=document.getElementById('stepsList');
steps.forEach((s,i)=>{ sl.innerHTML+=`<div class="step-item"><div class="sn">${i+1}</div><div class="st">${s}</div></div>`; });

buildDoors();
</script>
</body>
</html>
