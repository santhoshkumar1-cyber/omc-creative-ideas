<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Shopping Horoscope</title><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:radial-gradient(circle at top,#4d2cff,#12072f 65%);min-height:100vh;display:grid;place-items:center;color:white}.wrap{width:min(460px,94vw);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:32px;padding:30px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.35)}h1{font-size:38px;margin:12px 0}.moon{font-size:76px}.select{width:100%;padding:16px;border:0;border-radius:16px;font-size:18px;margin:18px 0}.btn{width:100%;border:0;border-radius:16px;padding:16px;background:#ffd86b;color:#26134d;font-weight:900;font-size:18px;cursor:pointer}.prediction{margin-top:20px;background:rgba(255,255,255,.14);border-radius:24px;padding:22px}.chip{display:inline-block;margin:6px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.18)}.share{background:#fff;color:#32126b;border-radius:18px;padding:16px;margin-top:16px;font-family:Arial,sans-serif}</style></head><body><main class="wrap"><div class="moon">🔮</div><h1>Your Big Billion Destiny</h1><p>Select your birth month and reveal your BBD shopping sign.</p><select id="month" class="select"><option>January</option><option>February</option><option>March</option><option>April</option><option>May</option><option>June</option><option>July</option><option>August</option><option>September</option><option>October</option><option>November</option><option>December</option></select><button class="btn" onclick="predict()">Reveal Horoscope</button><section id="out"></section></main><script>const lines=['You will almost buy headphones at 1:07 AM.','A forgotten wishlist item will call your name after midnight.','Your cart will become a personality test today.','A deal will find you before you find it.','You will compare 12 products and choose the first one.'];const cats=['Electronics','Fashion','Home','Beauty','Grocery'];const signs=['Cart Overthinker','Midnight Deal Seeker','Wishlist Ghost','Impulse Royalty','Discount Detective'];function pick(a,n){return a[n%a.length]}function predict(){let m=document.getElementById('month').selectedIndex;document.getElementById('out').innerHTML=`<div class="prediction"><h2>${pick(signs,m)} ♐</h2><p>${pick(lines,m+new Date().getDate())}</p><span class="chip">Lucky Category: ${pick(cats,m)}</span><span class="chip">Lucky Time: ${10+m}:07 PM</span><div class="share">My BBD horoscope says I’m a <b>${pick(signs,m)}</b>.</div><button class="btn" style="margin-top:14px" onclick="predict()">Swipe More Predictions</button></div>`}</script></body></html>
